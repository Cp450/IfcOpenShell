name: Build IfcOpenShell Windows

# BIM Devis fork: ifcopenshell-python 0.8.5 built WITHOUT CGAL (-DWITH_CGAL=OFF in
# win/build-all-win.py), x64 and Python 3.12 only. The dependency cache is read from the
# public IfcOpenShell/build-outputs repository; nothing is pushed or uploaded anywhere:
# the result is published as a workflow artifact.

on:
  workflow_dispatch:

jobs:
  build_ifcopenshell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs_on: windows-2022
            deps_dir: _deps-vs2022-x64-installed
            vcvars: '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"'
            build_branch: windows-x64
            zip_suffix: win64

    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout Build Repository (public dependency cache)
        uses: actions/checkout@v6
        with:
          repository: IfcOpenShell/build-outputs
          path: ${{ matrix.deps_dir }}
          ref: ${{ matrix.build_branch }}
          lfs: true

      - name: Install Dependencies
        run: |
          choco install -y sed 7zip.install

      - name: Unpack Dependencies
        run: |
          cd ${{ matrix.deps_dir }}
          Get-ChildItem -Path . -Filter 'cache-*.zip' | ForEach-Object {
            7z x $_.FullName
          }

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: win-${{ matrix.arch }}-sans-cgal
          max-size: 5000MB

      - name: Run Build Script And Pack .zip Archives
        shell: cmd
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          call ${{ matrix.vcvars }}
          cd win
          python build-all-win.py

      - name: Publish the build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifcopenshell-0.8.5-sans-cgal-${{ matrix.zip_suffix }}
          path: ~/output/*.zip
          retention-days: 30
